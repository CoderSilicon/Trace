name: Package (DEB/RPM)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ make pkg-config \
            libcurl4-openssl-dev libxml2-dev nlohmann-json3-dev \
            dpkg-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Package .deb
        run: cpack -B pkg --config build/CPackConfig.cmake -G DEB

      - name: Verify installability
        run: |
          sudo dpkg -i pkg/*.deb
          /usr/bin/sget -v

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sget-deb
          path: pkg/*.deb
          if-no-files-found: error

  rpm:
    name: Build .rpm (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake make gcc-c++ pkgconf-pkg-config \
            libcurl-devel libxml2-devel nlohmann-json-devel \
            rpm-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j"$(nproc)"

      - name: Package .rpm
        run: cpack -B pkg --config build/CPackConfig.cmake -G RPM

      - name: Verify installability
        run: |
          rpm -ivh pkg/*.rpm
          /usr/bin/sget -v

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sget-rpm
          path: pkg/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [deb, rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: pkg/
          merge-multiple: true

      - name: Show packages
        run: ls -la pkg/

      - name: Build release body
        run: ./scripts/release-body.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/body.md"

      - name: Create/update release with packages
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: sget ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/body.md
          files: pkg/*